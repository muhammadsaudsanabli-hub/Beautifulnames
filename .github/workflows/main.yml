name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create Project and Build
        run: |
          cordova create myApp com.example.app "AsmaUlHusnaApp"
          cp index.html myApp/www/
          cd myApp
          cordova platform add android
          cordova build android --no-telemetry
      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: My-Android-App
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
