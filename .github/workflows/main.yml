name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create Project and Build
        run: |
          cordova create myApp com.example.app "AsmaUlHusnaApp"
          # یہاں ہم آپ کی فائل کو تلاش کر کے index.html بنائیں گے
          if [ -f "index.html" ]; then
            cp index.html myApp/www/index.html
          elif [ -f "asma-ul-husna.html" ]; then
            cp asma-ul-husna.html myApp/www/index.html
          fi
          cd myApp
          cordova platform add android
          cordova build android --no-telemetry
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Android-App
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
